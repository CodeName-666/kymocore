[env]
build_flags =
    -DKYMO_ENABLE_TIMESTAMP=1

[env:uno]
platform = atmelavr@5.3.0
board = uno
framework = arduino
lib_deps =
    symlink://../../..
monitor_speed = 115200

[env:nano]
platform = atmelavr@5.3.0
board = nanoatmega328
framework = arduino
lib_deps =
    symlink://../../..
monitor_speed = 115200

[env:mega]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
lib_deps =
    symlink://../../..
monitor_speed = 115200
