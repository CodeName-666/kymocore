[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kymo-configurator"
version = "0.1.0"
description = "Qt-free configuration engine and optional Qt Widgets editor for KymoCore"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8.3,<6.10"]

[project.scripts]
kymo-configurator = "kymo_configurator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
