license: "GPL-3.0-only"
maintainers:
  - "Christof Seidel <kontakt@kymotrace.de>"
tags:
  - telemetry
  - tracing
  - plotting
  - binary-protocol
  - sensor
  - uart
  - mqtt
dependencies:
  idf: ">=5.0"
files:
