name: KymoCore
on: [push, pull_request, workflow_dispatch]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Native suite (utilities, codec, runtime, sender, trace, compile-out, structure)
        run: python3 test/native_test.py
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio pkg pack . -o KymoCore.tar.gz
  configurator:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install pytest -e "tools/configurator[gui]"
      - name: Configuration engine, generated C/C++ and Qt workflows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tools/configurator/tests
